name: Skill compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        portbook-ref: [v0.3.0, main]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Portbook
        uses: actions/checkout@v7
        with:
          repository: sviatoslav/portbook
          ref: ${{ matrix.portbook-ref }}
          path: .portbook-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .portbook-source/go.mod
          cache-dependency-path: .portbook-source/go.sum
      - name: Build Portbook
        working-directory: .portbook-source
        run: go build -o "$RUNNER_TEMP/portbook" ./cmd/portbook
      - name: Check documented commands
        run: python3 scripts/check-compatibility.py "$RUNNER_TEMP/portbook"
